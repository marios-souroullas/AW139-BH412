name: aw139_cruise
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_map_dragmarker: ^8.0.0
  latlong2: ^0.9.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  fl_chart: ^1.1.1
  http: ^1.5.0
  geolocator: ^14.0.2
  flutter_tts: ^3.8.2
  flutter_barometer: ^0.1.0
  sensors_plus: ^6.0.3
  pdf: ^3.11.0
  printing: ^5.12.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.0
  google_fonts: ^6.0.0
  file_selector: ^1.0.4
  path_provider: ^2.1.5
  xml: ^6.1.0
  firebase_core: ^3.15.2
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/performance_tables/bell_412.csv
    - assets/airports/cy_apt.geojson
    - assets/airspaces/cy_asp.geojson
    - assets/navaids/cy_nav.geojson
    - assets/obstacles/cy_obs.json
    - assets/reporting_points/cy.ifrrpp.geojson
    - assets/obstacles/gr_obs.geojson
    - assets/airports/gr_apt.geojson
    - assets/navaids/gr_nav.geojson
    - assets/reporting_points/gr_rpp.geojson
    - assets/obstacles/il_obs.geojson
    - assets/airports/il_apt.geojson
    - assets/navaids/il_nav.geojson
    - assets/reporting_points/il_rpp.geojson
    - assets/Power_Lines/Power_Lines.kml
    - assets/villages/village_cords.geojson


  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf

linter:
  rules:
    curly_braces_in_flow_control_structures: false